services:
  postgres:
    image: postgres:16-alpine
    container_name: omnimedia_postgres
    restart: always
    environment:
      POSTGRES_DB: omnimedia
      POSTGRES_USER: omnimedia
      POSTGRES_PASSWORD: omnimedia_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnimedia -d omnimedia']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omnimedia_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: omnimedia_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: omnimedia
      RABBITMQ_DEFAULT_PASS: omnimedia_password
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
