services:
  postgres:
    image: postgres:16-alpine
    container_name: omnimedia_postgres
    restart: always
    environment:
      POSTGRES_DB: omnimedia
      POSTGRES_USER: omnimedia
      POSTGRES_PASSWORD: omnimedia_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnimedia -d omnimedia']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
